name: "speech-redaction"
version: "0.1.0"
description: "Removes human speech from node audio before it is persisted, so acoustic monitoring can continue without recording people"
keywords: "audio, privacy, speech, redaction, YAMnet, acoustic monitoring"
authors: "Miguel Hernandez <miguelhernandez2028@u.northwestern.edu>"
collaborators: "Pete Beckman"
funding: "NSF 2331263, NSF 2436842"
license: "MIT"
homepage: "https://github.com/Miguel-Hernandez1/speech-redaction"
source:
  architectures:
    - "linux/arm64"
  url: "https://github.com/Miguel-Hernandez1/speech-redaction.git"
  branch: "main"

# NOTE: ECR input types support ONLY "string" and "int". Boolean flags
# (--all-unseen, --noise-fill, --dry-run) are declared "string" and are
# presence-based: include them in a job's args list to enable, omit to disable.
inputs:
- id: "source"
  type: "string"
- id: "input"
  type: "string"
- id: "output-cache"
  type: "string"
- id: "cache-root"
  type: "string"
- id: "every"
  type: "string"
- id: "select-every"
  type: "string"
- id: "all-unseen"
  type: "string"
- id: "max-frames"
  type: "int"
- id: "consumer-id"
  type: "string"
- id: "seen-store"
  type: "string"
- id: "seen-max"
  type: "int"
- id: "output-source"
  type: "string"
- id: "cache-max-count"
  type: "int"
- id: "cache-max-mb"
  type: "int"
- id: "noise-fill"
  type: "string"
- id: "dry-run"
  type: "string"

metadata:
  ontology: env.speechredaction.*

